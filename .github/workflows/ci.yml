name: TalentLens CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Test Suite & Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: password
          POSTGRES_DB: talentlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Backend Imports
        run: |
          cd backend
          python -c "import app.main; print('FastAPI App and routers imported successfully!')"

      - name: Run Backend Tests
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-32-chars-long-talentlens-ci
          DATABASE_URL: postgresql+asyncpg://runner:password@localhost:5432/talentlens_test
          TEST_DATABASE_URL: postgresql+asyncpg://runner:password@localhost:5432/talentlens_test
          OLLAMA_BASE_URL: http://localhost:11434
        run: |
          cd backend
          pytest -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/react-ts/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend/react-ts
          npm ci

      - name: Run Frontend TypeScript Check & Build
        run: |
          cd frontend/react-ts
          npm run build
